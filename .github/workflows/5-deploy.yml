name: Deploy
on:
  workflow_call:
    inputs:
      BASE_URL:
        description: "Cypress base url"
        required: true
        type: string
      BRANCH:
        description: "Branch name"
        required: true
        type: string
      COMMIT_SHA:
        description: "Commit sha"
        required: true
        type: string
      DOMAIN:
        description: "Website domain"
        required: true
        type: string
      ENVIRONMENT:
        description: "Deploy environment"
        required: true
        type: string
      RUN_CMD:
        description: "Cypress run command"
        required: true
        type: string
    secrets:
      CLOUDFLARE_ACCOUNT_ID:
        description: "Cloudflare account id"
        required: true
      CLOUDFLARE_PAGES_API:
        description: "Cloudflare Pages API key"
        required: true
      CYPRESS_KEY:
        description: "Cypress API key"
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.ENVIRONMENT }}
      url: ${{ inputs.BASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.11.x"

      - uses: pnpm/action-setup@v3
        name: Install pnpm
        with:
          version: 8
          run_install: false

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ inputs.ENVIRONMENT }}-${{ inputs.COMMIT_SHA }}
          path: ./dist

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_API }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./dist --project-name=reallyluis --branch=${{ inputs.BRANCH }} --commit-dirty=true --commit-hash=${{ inputs.COMMIT_SHA }}

  e2e:
    needs: deploy
    uses: ./.github/workflows/6-e2e.yml
    with:
      BASE_URL: ${{ inputs.BASE_URL }}
      RUN_CMD: ${{ inputs.RUN_CMD }}
    secrets:
      CYPRESS_KEY: ${{ secrets.CYPRESS_KEY }}
